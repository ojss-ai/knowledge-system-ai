# [plan-fix] vs the 5.3 block:
# - build-backend "setuptools.backends.legacy:build" does not exist → setuptools.build_meta.
# - The tool is a flat-module layout (Tasks 1-3), not a kb_confluence_sync package:
#   modules are listed via py-modules and the console script targets cli:main
#   ("kb_confluence_sync.__main__:main" would import a nonexistent package; a
#   "__main__:main" entry would resolve to the running script itself).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-confluence-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "html2text>=2020.1",
    "python-dotenv>=1.0",
]

[project.scripts]
kb-confluence-sync = "cli:main"

[tool.setuptools]
py-modules = ["cli", "confluence_client", "sync_engine", "xhtml_to_md"]
