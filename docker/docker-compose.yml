services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_dev_password}
      POSTGRES_DB: kb
    ports: ["5432:5432"]
    volumes: ["./pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-kb_dev_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7687:7687", "7474:7474"]
    volumes: ["./neo4jdata:/data", "./neo4jlogs:/logs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kb
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-kb_dev_password}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./miniodata:/data"]

  api:
    # Containerized FastAPI, per docs/03-scalability-deployment.md Phase A.
    # Not started by default `make up` (dev uses `make api` + host uvicorn for --reload);
    # opt in with `make up-full` when you need the prod-shaped stack end to end.
    profiles: ["full"]
    build: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://kb:${POSTGRES_PASSWORD:-kb_dev_password}@postgres:5432/kb
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kb_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
    ports: ["8000:8000"]
